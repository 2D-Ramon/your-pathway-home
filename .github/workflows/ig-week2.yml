# Instagram Week 2 — runs in GitHub, not on a local PC.
# 11:00 AM America/Chicago = 16:00 UTC (CDT, Sep–Oct 2026)
# 12:30 PM America/Chicago = 17:30 UTC
name: IG Week 2 publish

on:
  schedule:
    - cron: "0 16 24-30 9 *"
    - cron: "0 16 1-3 10 *"
    - cron: "30 17 24-30 9 *"
    - cron: "30 17 1-3 10 *"
  workflow_dispatch:
    inputs:
      kind:
        description: feed, story, or auto
        type: choice
        options:
          - auto
          - feed
          - story
        default: auto

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish Instagram
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          KIND: ${{ github.event.inputs.kind || 'auto' }}
        run: node .github/scripts/publish-ig.mjs
